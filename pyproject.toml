# ======================================================================== #
# Python packaging metadata for pynari.
#
# Build and install with pip (the ANARI SDK must be findable by CMake,
# e.g. through CMAKE_PREFIX_PATH or anari_DIR):
#
#   pip install . -C cmake.define.CMAKE_PREFIX_PATH=/path/to/anari/install
#
# See the "Building with pip" section in README.md for details.
# ======================================================================== #

[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "pynari"
dynamic = ["version"]
description = "A thin Python wrapper over the Khronos ANARI rendering API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.8"
authors = [
  { name = "Ingo Wald" },
]
keywords = ["ANARI", "rendering", "ray tracing", "visualization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Graphics :: 3D Rendering",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "numpy",
]

[project.urls]
Homepage = "https://github.com/ingowald/pynari"
Repository = "https://github.com/ingowald/pynari"
Issues = "https://github.com/ingowald/pynari/issues"

# ------------------------------------------------------------------------
# scikit-build-core: drive the existing CMake build from pip.
# ------------------------------------------------------------------------
[tool.scikit-build]
minimum-version = "build-system.requires"
# CUDA_ARCHITECTURES / CMP0104 handling in CMakeLists.txt needs >= 3.18
cmake.version = ">=3.18"
build-dir = "build-pip/{wheel_tag}"
# Everything that goes into the wheel is placed there by CMake's install()
# rules (pynari/__init__.py + the extension module); there is no pure
# python package directory to copy.
wheel.packages = []
# Keep the large sample data sets out of the source distribution.
sdist.exclude = [
  "samples/*.binary.*",
  "samples/*.npz",
]

# The package version is taken from PYNARI_VERSION_{MAJOR,MINOR,PATCH}
# in CMakeLists.txt so it only has to be maintained in one place.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = '''(?sx)
PYNARI_VERSION_MAJOR\s+(?P<major>\d+)\s*\).*?
PYNARI_VERSION_MINOR\s+(?P<minor>\d+)\s*\).*?
PYNARI_VERSION_PATCH\s+(?P<patch>\d+)\s*\)
'''
result = "{major}.{minor}.{patch}"
