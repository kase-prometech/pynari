# Python packaging metadata for pynari; see "Building with pip" in README.md.

[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "pynari"
dynamic = ["version"]
description = "A thin Python wrapper over the Khronos ANARI rendering API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.8"
authors = [
  { name = "Ingo Wald" },
]
keywords = ["ANARI", "rendering", "ray tracing", "visualization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Graphics :: 3D Rendering",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "numpy",
]

[project.urls]
Homepage = "https://github.com/ingowald/pynari"
Issues = "https://github.com/ingowald/pynari/issues"

# ------------------------------------------------------------------------
# scikit-build-core: drive the existing CMake build from pip.
# ------------------------------------------------------------------------
[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build-pip/{wheel_tag}"
# always build with ninja (fetched from PyPI if needed) so the C++/CUDA
# sources compile in parallel instead of falling back to serial make
ninja.make-fallback = false
# CMake's install() rules place everything in the wheel; no pure python
# package directory to copy
wheel.packages = []
# keep the large sample data sets and pybind11's tests/docs out of the sdist
sdist.exclude = [
  "samples/*.binary.*",
  "samples/*.npz",
  "external/pybind11/tests",
  "external/pybind11/docs",
]

[tool.scikit-build.cmake.define]
PYNARI_BUILD_FOR_PIP = "ON"

# The package version is taken from PYNARI_VERSION_{MAJOR,MINOR,PATCH}
# in CMakeLists.txt so it only has to be maintained in one place.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = '''(?sx)
PYNARI_VERSION_MAJOR\s+(?P<major>\d+)\s*\).*?
PYNARI_VERSION_MINOR\s+(?P<minor>\d+)\s*\).*?
PYNARI_VERSION_PATCH\s+(?P<patch>\d+)\s*\)
'''
result = "{major}.{minor}.{patch}"
